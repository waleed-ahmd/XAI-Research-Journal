# Builds the short paper PDF so nobody needs LaTeX installed locally.
# - Every push/PR touching shortpaper/: the PDF is attached to the run as an
#   artifact (Actions tab -> run -> Artifacts -> short-paper).
# - Pushes to main also update the "latest-draft" pre-release, so the README
#   can link to a fixed URL for the current draft. Publishing runs one at a
#   time and only for the current tip of main, so an older build can never
#   replace a newer draft.
name: Build short paper

on:
  push:
    paths: ["shortpaper/**", ".github/workflows/paper.yml"]
  pull_request:
    paths: ["shortpaper/**", ".github/workflows/paper.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: shortpaper
          root_file: main.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: short-paper
          path: shortpaper/main.pdf

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize publishing. A newer queued run replaces an older queued one.
    concurrency:
      group: paper-latest-draft
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: short-paper

      - name: Publish latest-draft release
        run: |
          # If main has moved on, a newer run will publish its own build.
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at ${head::7}, this build is ${GITHUB_SHA::7}; skipping publish."
            exit 0
          fi

          mv main.pdf group7-short-paper.pdf
          notes="Built automatically from ${GITHUB_SHA::7}. Not the submitted version."
          if gh release view latest-draft >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest-draft" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload latest-draft group7-short-paper.pdf --clobber
            gh release edit latest-draft --notes "$notes"
          else
            gh release create latest-draft group7-short-paper.pdf \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Short paper: latest draft" \
              --notes "$notes"
          fi
