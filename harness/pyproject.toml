[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cot-faithfulness-harness"
version = "0.1.0"
description = "Re-evaluation harness for Turpin et al. (2023) CoT faithfulness on current models (XAI Group 7)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "tenacity>=8.2",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cot-harness = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
