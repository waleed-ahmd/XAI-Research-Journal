# Group 7 CoT-faithfulness harness config.
# All group-level methodology choices live here, not hard-coded in code.
# See harness/README.md for how each field is used.

seed: 20261007 # fixed seed for reproducible question selection and cue-letter choice

questions:
  # The 13 BBH tasks used in Turpin et al. (2023), Table/Appendix task list.
  # Source: github.com/milesaturpin/cot-unfaithfulness, data/bbh/<task>/val_data.json
  tasks:
    - causal_judgment
    - date_understanding
    - disambiguation_qa
    - hyperbaton
    - logical_deduction_five_objects
    - movie_recommendation
    - navigate
    - ruin_names
    - snarks
    - sports_understanding
    - temporal_sequences
    - tracking_shuffled_objects_three_objects
    - web_of_lies
  total_count: 30 # full set size (current plan: journal/2026-10-02.md)
  pilot_count: 5 # first N of the selected set used for `pilot`

conditions:
  - original # no cue
  - cue # Turpin "Suggested Answer" cue, pointing at a deterministically-chosen wrong option
  - original_repeat # original prompt run again, to measure baseline flip rate from randomness alone

n_runs: 1 # runs per (question, condition, model). Increase to measure within-condition variance.

prompt_format:
  few_shot: false # TEAM DECISION (journal/2026-10-02.md): match Turpin's zero-shot CoT setting, not few-shot.
  # Deviation from the original repo: Turpin's run_eval.py only applies the Human:/Assistant:
  # raw-text prompt markers for the old text-completion APIs. We send the same prompt text as a
  # single user-turn message via each provider's modern chat/messages API instead.

models:
  anthropic:
    display_name: "Claude Sonnet 5.5"
    # Verified against https://platform.claude.com/docs/en/models/overview (2026-10-07).
    model_id: "claude-sonnet-5-5"
    thinking:
      type: adaptive
      display: summarized # max visibility Claude Sonnet 5.5 exposes; no setting returns raw CoT.
    max_tokens: 4096
    # Claude Sonnet 5.5 rejects any non-default temperature/top_p/top_k with a 400 error
    # (platform.claude.com/docs/en/build-with-claude/thinking, "Sampling parameters").
    # Do not set temperature for this model.
    # Verified against https://platform.claude.com/docs/en/models/overview (2026-10-07).
    price_per_million_input_tokens: 2.0
    price_per_million_output_tokens: 10.0

  openai:
    display_name: "GPT-5.6 Luna"
    # TODO(group): UNVERIFIED. The journal (journal/2026-10-02.md, journal/2026-09-30.md) names
    # "GPT-5.6 Luna", but OpenAI's current model docs (developers.openai.com/api/docs/models,
    # checked 2026-10-07) list no "gpt-5.6-luna" — the lightweight-tier model in the current
    # flagship family is "GPT-6 Luna" (model_id "gpt-6-luna"); "gpt-5.6" currently only names
    # "GPT-5.6 Cyber", a different (cybersecurity) model. Confirm which model the group actually
    # means before any real API call, and fill in model_id below. Left blank deliberately so a
    # real run fails loudly instead of silently calling the wrong model.
    model_id: "" # TODO: fill in and remove this comment once confirmed
    reasoning:
      effort: medium
      summary: auto
    max_output_tokens: 4096
    # Temperature support for this model's reasoning behaviour is unconfirmed from the docs we
    # could reach (see harness/README.md). We omit the temperature parameter entirely rather
    # than guess a value.
    # TODO(group): UNVERIFIED pricing — depends on which model is actually confirmed above.
    # `estimate` reports the OpenAI-side cost as unavailable until both of these are filled in.
    price_per_million_input_tokens: null
    price_per_million_output_tokens: null

estimate:
  # Rough token counts per single model call, used only for the `estimate` command's
  # cost projection. Not measured yet — update after the pilot's real responses.
  assumed_input_tokens_per_call: 600
  assumed_output_tokens_per_call: 500
