# Group 7 CoT-faithfulness harness config.
# All group-level methodology choices live here, not hard-coded in code.
# See harness/README.md for how each field is used.

protocol_version: "2026-10-09-visible-explanation-sol-opus-v1" # change this when the experimental protocol changes
seed: 20261007 # fixed seed for reproducible question selection and cue-letter choice

questions:
  # We deliberately focus on one Turpin BBH task so the 30-question sample
  # is not spread too thinly across heterogeneous task types.
  tasks:
    - temporal_sequences
  total_count: 30
  pilot_count: 5
conditions:
  - original # no cue
  - cue # Turpin "Suggested Answer" cue, pointing at a deterministically-chosen wrong option
  - original_repeat # original prompt run again, to estimate baseline answer instability without the cue

n_runs: 1 # runs per (question, condition, model). Increase to measure within-condition variance.

prompt_format:
  few_shot: false # No few-shot demonstrations in our controlled adaptation.
  explanation_mode: visible_explanation # Rate the model's user-visible explanation, not API reasoning summaries.
  # We retain Turpin's Suggested Answer cue wording but deliberately ask current
  # reasoning models for a concise visible explanation. We do not treat API-provided
  # reasoning summaries as the explanation being rated.

models:
  anthropic:
    display_name: "Claude Opus 5.5"
    # Verified against https://platform.claude.com/docs/en/models/opus-5-5/overview (2026-10-09).
    model_id: "claude-opus-5-5"
    thinking:
      type: adaptive
      display: summarized # summarized display is readable; no setting returns raw CoT.
    # Previously left unset, so the API applied its own default (which is "high"
    # for Claude Opus 5.5). Made explicit at the documented default.
    # Verified against https://platform.claude.com/docs/en/build-with-claude/effort:
    # "Claude Opus 5.5 supports all five effort levels, and `medium` is the default
    # on the Claude API." (checked 2026-10-09)
    effort: medium
    max_tokens: 16384
    # Claude Opus 5.5 rejects unsupported sampling settings; we omit temperature/top_p/top_k
    # rather than guessing provider-specific values.
    # Do not set temperature for this model.
    # Verified against https://platform.claude.com/docs/en/models/opus-5-5/overview (2026-10-09).
    price_per_million_input_tokens: 4.0
    price_per_million_output_tokens: 20.0

  openai:
    display_name: "GPT-5.6 Sol"
    # CONFIRMED (group decision, 2026-10-09): the model is GPT-5.6 Sol, model id
    # "gpt-5.6-sol" — the flagship GPT-5.6 model. Chosen as the comparable
    # flagship-tier counterpart to Claude Opus 5.5 for this study.
    # Verified against https://developers.openai.com/api/docs/models/gpt-5.6-sol (2026-10-09).
    model_id: "gpt-5.6-sol"
    reasoning:
      effort: medium
      summary: auto
    max_output_tokens: 16384
    # Temperature support for this model's reasoning behaviour is unconfirmed from the docs we
    # could reach (see harness/README.md). We omit the temperature parameter entirely rather
    # than guess a value.
    # Verified against https://developers.openai.com/api/docs/models/gpt-5.6-sol (2026-10-09).
    price_per_million_input_tokens: 4.0
    price_per_million_output_tokens: 20.0

estimate:
  # Token counts per single model call, used only for the `estimate` command's cost
  # projection.
  #
  # assumed_input_tokens_per_call: MEASURED, not guessed. Built the real prompt for
  # all 30 selected temporal_sequences questions in every condition (original,
  # cue, original_repeat) and counted tokens with tiktoken's cl100k_base encoding
  # (a stand-in for Claude's tokenizer, which has no public local tokenizer; token
  # density is close enough for English text that this doesn't change the
  # conclusion). Measured: original/original_repeat mean 228.2 (208-252), cue mean
  # 244.2 (224-268), overall mean 233.6. 260 covers the cue condition's mean with
  # a margin, replacing the previous unmeasured guess of 600 (checked 2026-10-09).
  assumed_input_tokens_per_call: 260
  # assumed_output_tokens_per_call: STILL AN UNMEASURED GUESS, deliberately not
  # changed. The prompt only asks for a 2-4 sentence visible explanation (~60-120
  # tokens), but both providers bill hidden reasoning/thinking tokens as output
  # even when not returned to us (Anthropic: thinking tokens "are billed as output
  # tokens, even when the thinking text isn't returned to you"; OpenAI: same for
  # reasoning tokens). At medium/high effort that hidden budget could be a few
  # hundred to a few thousand tokens depending on the question, and there's no way
  # to measure it without a real call. This is exactly what the pilot is for —
  # update this from the pilot's real responses before trusting `estimate` for a
  # full run.
  assumed_output_tokens_per_call: 500
